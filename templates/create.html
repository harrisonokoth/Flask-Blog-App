<!-- templates/create.html -->

{% extends "base.html" %}

{% block title %}Create New Post{% endblock %}

{% block content %}
<section class="create-post">
    <!-- Heading for the page -->
    <h2>Create New Post</h2>

    <!-- Form to submit a new blog post -->
    <!-- method="POST" sends form data to the server -->
    <!-- action="{{ url_for('create_post') }}" sends the data to the 'create_post' route -->
    <!-- enctype="multipart/form-data" allows file uploads (like images) -->
    <form method="POST" action="{{ url_for('create_post') }}" enctype="multipart/form-data" class="post-form">

        <!-- Input field for the post title -->
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <!-- Textarea for the main content of the post -->
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10" required></textarea>
        </div>

        <!-- Optional image upload field -->
        <div class="form-group">
            <label for="image">Featured Image (optional)</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>

        <!-- Button to submit the form -->
        <button type="submit" class="btn">Publish Post</button>
    </form>
</section>
{% endblock %}
